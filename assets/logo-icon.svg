<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <polygon points="24,10 35,16.5 35,29.5 24,36 13,29.5 13,16.5" 
           fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="2 1" />
  <polygon points="24,14 31,18 31,26 24,30 17,26 17,18" 
           fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)" />
  <circle cx="24" cy="22" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <line x1="24" y1="14" x2="24" y2="7" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" />
  <line x1="31" y1="18" x2="37" y2="14" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" />
  <line x1="31" y1="26" x2="37" y2="30" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" />
  <line x1="24" y1="30" x2="24" y2="37" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" />
  <line x1="17" y1="26" x2="11" y2="30" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" />
  <line x1="17" y1="18" x2="11" y2="14" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="24" cy="7" r="1.2" fill="#00f2fe" />
  <circle cx="37" cy="14" r="1.2" fill="#00f2fe" />
  <circle cx="37" cy="30" r="1.2" fill="#10b981" />
  <circle cx="24" cy="37" r="1.2" fill="#10b981" />
  <circle cx="11" cy="30" r="1.2" fill="#10b981" />
  <circle cx="11" cy="14" r="1.2" fill="#00f2fe" />
</svg>