<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="fullAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="fullBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#fullBgGrad)" stroke="url(#fullBorder)" stroke-width="1.5" />
  <polygon points="24,10 35,16.5 35,29.5 24,36 13,29.5 13,16.5" 
           fill="none" stroke="url(#fullAccent)" stroke-width="1.5" stroke-dasharray="2 1" />
  <polygon points="24,14 31,18 31,26 24,30 17,26 17,18" 
           fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.8" filter="url(#fullGlow)" />
  <circle cx="24" cy="22" r="2.5" fill="#ffffff" filter="url(#fullGlow)" />
  <circle cx="24" cy="7" r="1.2" fill="#00f2fe" />
  <circle cx="37" cy="14" r="1.2" fill="#00f2fe" />
  <circle cx="37" cy="30" r="1.2" fill="#10b981" />
  <circle cx="24" cy="37" r="1.2" fill="#10b981" />
  <circle cx="11" cy="30" r="1.2" fill="#10b981" />
  <circle cx="11" cy="14" r="1.2" fill="#00f2fe" />

  <!-- Right Typography -->
  <text x="58" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.5">BETTER TAB</text>
  <text x="58" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1.8">MISSION CONTROL</text>
  
  <!-- Version Pill -->
  <rect x="216" y="14" width="46" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <text x="239" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">v3.0.4</text>
</svg>